name: Streamonce
description: StreamOnce was a cloud-based enterprise collaboration platform founded in 2012 in San
  Jose, California by Ilan Twig and Ariel Cohen (who later co-founded TripActions/Navan). The product
  connected business systems into a social enterprise layer so teams could reply to emails, read
  documents, and post to Yammer and Chatter from a single unified interface. Backed by Lightspeed
  Venture Partners (~$1.25-1.36M raised), the company was acquired by Jive Software in 2013, less than
  a year after its initial funding. StreamOnce is no longer an operating company and publishes no
  active product, developer portal, or API; the streamonce.com domain now redirects to a domain-sale
  marketplace. This profile is retained as a historical/portfolio record surfaced via
  Lightspeed Venture Partners.
